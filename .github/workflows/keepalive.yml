name: keepalive
# Keeps the free Supabase project from pausing (it pauses after about a week of no activity) and warns us if the site or
# database stops answering: a failed run sends GitHub's failure email to the repository owner. No secrets are used.
# Note: GitHub switches scheduled workflows off after 60 days with no commits to the repository; any commit re-enables them.
on:
  schedule:
    - cron: "17 5 */2 * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the site and the database
        run: |
          curl --fail --silent --show-error --max-time 30 --retry 2 --retry-delay 10 \
            "https://flightdeck.stegmon.com/api/health?deep=1" | tee /dev/stderr | grep -q '"db":"ok"'
